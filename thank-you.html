<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Request received | Epic Auto Spa</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#07111e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .ty{min-height:100vh;display:grid;place-items:center;text-align:center;padding:48px 16px;background:var(--paper)}
  .ty-check{width:84px;height:84px;margin:0 auto;border-radius:50%;display:grid;place-items:center;background:var(--blue-wash);border:1.5px solid var(--blue);color:var(--blue)}
  .ty-check svg{width:40px;height:40px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .ty h1{margin-top:28px;font-size:clamp(40px,7vw,80px);font-weight:700;letter-spacing:-.035em}
  .ty p{margin:20px auto 0;max-width:520px;color:var(--steel);font-size:17px}
  .ty .actions{margin-top:34px;justify-content:center}
</style>
</head>
<body>
<main class="ty">
  <div>
    <div class="ty-check"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h1>Request received.</h1>
    <p>Thanks! Your booking request was sent. This is a request, not a confirmed appointment — I'll review the details and reach out personally to confirm the date, price, and location.</p>
    <div class="actions">
      <a class="btn" href="/">Back to home</a>
      <a class="btn btn-quiet" href="tel:+19082085724">Call 908-208-5724</a>
    </div>
  </div>
</main>
</body>
</html>
